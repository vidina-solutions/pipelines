name: Mirror to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # every Sunday 03:00 UTC

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror repository
        run: |
          git remote add gitlab https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@gitlab.vidina.net/upstream/pipelines.git
          git push --mirror gitlab
